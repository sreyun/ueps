# 发布构建：推送 v* 标签时自动测试，并分别在 Windows / Linux 上打包可执行程序，上传到该标签的 GitHub Release。
#   Windows → ps-platform-<版本>-windows-x64.zip（内含 ps-platform.exe）
#   Linux   → ps-platform-<版本>-linux-x64.tar.gz（内含 ps-platform，glibc ≥ 2.28）
# 也可在 Actions 页面手动运行（填写已存在的标签），用于给已有标签补发构建产物。
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "要构建并发布的标签，例如 v1.2.0"
        required: true

permissions:
  contents: write

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  TAG: ${{ github.event.inputs.tag || github.ref_name }}
  NODE_VERSION: "26"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci --no-audit --no-fund
      # 测试含少量时序相关用例，CI 机器偶发抖动时重试一次
      - run: npm test || npm test

  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            pattern: "dist/*-windows-x64.zip"
          - os: ubuntu-22.04
            pattern: "dist/*-linux-x64.tar.gz"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run build:exe
      - name: 冒烟测试（启动程序并检查健康接口）
        shell: bash
        run: |
          set -e
          dir=$(ls -d dist/ps-platform-*/ | head -1)
          cd "$dir"
          printf '{"http":{"port":18950,"publicPort":18951,"host":"127.0.0.1"},"localAgent":{"enable":false},"log":{"level":"info","file":false}}' > config.json
          bin=./ps-platform; [ -f ps-platform.exe ] && bin=./ps-platform.exe
          PS_ADMIN_PASSWORD=CiSmoke12345 $bin > run.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:18950/healthz && break; sleep 1; done
          curl -sf http://127.0.0.1:18950/healthz | grep -q '"status":"ok"'
          curl -sf -o /dev/null http://127.0.0.1:18950/admin/
          curl -sf -o /dev/null "http://127.0.0.1:18951/video.html?urlPrefix=default"
          kill %1 || true
          rm -rf config.json run.log data
      - uses: actions/upload-artifact@v4
        with:
          name: package-${{ matrix.os }}
          path: ${{ matrix.pattern }}
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true
      - name: 生成校验和与发布说明
        run: |
          cd assets && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt && cd ..
          ver="${TAG#v}"
          # 取 CHANGELOG.md 中对应版本的一节作为发布说明
          awk -v v="## $ver" '$0==v{f=1;next} /^## /{if(f)exit} f' CHANGELOG.md > notes.md || true
          {
            echo "## 下载"
            echo ""
            echo "| 系统 | 文件 | 可执行程序 |"
            echo "|---|---|---|"
            echo "| Windows x64 | \`ps-platform-$ver-windows-x64.zip\` | \`ps-platform.exe\` |"
            echo "| Linux x64（glibc ≥ 2.28） | \`ps-platform-$ver-linux-x64.tar.gz\` | \`ps-platform\` |"
            echo ""
            echo "解压后按包内「运行说明.txt」或 docs/INSTALL.md 运行，无需安装 Node.js；docker-compose 部署见 deploy/。"
            echo ""
            cat notes.md
          } > release-notes.md
      - name: 创建 / 更新 Release 并上传文件
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --notes-file release-notes.md
            gh release upload "$TAG" assets/* --clobber
          else
            gh release create "$TAG" assets/* --title "ps-platform ${TAG#v}" --notes-file release-notes.md --verify-tag
          fi
