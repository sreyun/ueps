# 发布构建：推送 v* 标签时自动测试，并分别在 Windows / Linux 上打包可执行程序，上传到该标签的 GitHub Release。
#   Windows → ps-platform-<版本>-windows-x64.zip（内含 ps-platform.exe）
#             ps-platform-agent-setup-<版本>.exe（渲染机图形安装程序；平台「接入渲染机」一键获取的也是它）
#   Linux   → ps-platform-<版本>-linux-x64.tar.gz（内含 ps-platform，glibc ≥ 2.28）
#             ps-platform-agent-<版本>-linux-x64（单独的可执行文件，供平台一键获取 Linux Agent）
# 也可在 Actions 页面手动运行（填写已存在的标签），用于给已有标签补发构建产物。
name: Release · 可执行程序（Windows / Linux）

on:
  push:
    tags: ["v*"]
    # 修改构建脚本 / 本工作流时在 main 上只做测试与构建验证（不发布）
    branches: [main]
    paths: ["build/**", "agent-setup/**", ".github/workflows/**", "package.json", "package-lock.json", "server.js"]
  workflow_dispatch:
    inputs:
      tag:
        description: "要构建并发布的标签，例如 v1.2.0"
        required: true

permissions:
  contents: write

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  TAG: ${{ github.event.inputs.tag || github.ref_name }}
  NODE_VERSION: "26"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      # 防止 package.json / src/app.js 忘记改版本号：发布包名与程序内版本必须等于标签
      - name: 校验标签与版本号一致
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        run: |
          ver="${TAG#v}"; core="${ver%%-*}"
          pkg=$(node -p "require('./package.json').version")
          app=$(sed -n 's/^const VERSION = "\([^"]*\)";.*/\1/p' src/app.js)
          for v in "$pkg" "$app"; do
            if [ "$v" != "$ver" ] && [ "$v" != "$core" ]; then
              echo "::error title=version::标签 $TAG 与 package.json（$pkg）/ src/app.js（$app）中的版本号不一致，发版前请先修改版本号"
              exit 1
            fi
          done
          echo "版本号一致：$ver"
      - run: npm ci --no-audit --no-fund
      # 测试含少量时序相关用例，CI 机器偶发抖动时重试一次
      - run: npm test || npm test

  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            pattern: |
              dist/*-windows-x64.zip
              dist/ps-platform-agent-setup-*.exe
          - os: ubuntu-22.04
            pattern: |
              dist/*-linux-x64.tar.gz
              dist/ps-platform-agent-*-linux-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: 构建可执行程序
        shell: bash
        run: |
          node -v
          if ! npm run build:exe > build.log 2>&1; then
            cat build.log
            # 把错误输出写成注解，便于在 Actions 页面直接看到原因
            tail -n 25 build.log | sed 's/%/%25/g' | while IFS= read -r l; do [ -n "$l" ] && echo "::error title=build:exe::$l"; done
            exit 1
          fi
          cat build.log
      - name: 冒烟测试（启动程序并检查健康接口）
        shell: bash
        run: |
          # 在临时目录解压发布包运行（与用户实际使用方式一致，也不影响上传的压缩包）
          work=$(mktemp -d)
          shopt -s nullglob   # Actions 以 bash -eo pipefail 运行：不能用会失败的 ls 通配
          files=(dist/ps-platform-*.zip dist/ps-platform-*.tar.gz)
          archive="${files[0]}"
          [ -n "$archive" ] || { echo "::error title=smoke::没有找到发布包"; exit 1; }
          if [ "$RUNNER_OS" = "Windows" ]; then
            "$SYSTEMROOT/System32/tar.exe" -xf "$archive" -C "$(cygpath -w "$work")"   # Windows tar 需要 Windows 路径
          else
            tar -xzf "$archive" -C "$work"
          fi
          cd "$work"/ps-platform-*/ || { echo "::error title=smoke::解压失败"; exit 1; }
          printf '{"http":{"port":18950,"publicPort":18951,"host":"127.0.0.1"},"localAgent":{"enable":false},"log":{"level":"info","file":false}}' > config.json
          bin=./ps-platform; [ -f ps-platform.exe ] && bin=./ps-platform.exe
          PS_ADMIN_PASSWORD=CiSmoke12345 $bin > run.log 2>&1 &
          ok=0
          for i in $(seq 1 40); do
            if curl -sf http://127.0.0.1:18950/healthz | grep -q '"status":"ok"'; then ok=1; break; fi
            sleep 1
          done
          if [ $ok = 1 ]; then
            curl -sf -o /dev/null http://127.0.0.1:18950/admin/ || ok=0
            curl -sf -o /dev/null "http://127.0.0.1:18951/video.html?urlPrefix=default" || ok=0
          fi
          # Windows 上直接结束进程（Git Bash 的 kill 对原生进程不可靠）；不再删除数据目录（进程退出前文件仍被占用）
          if [ "$RUNNER_OS" = "Windows" ]; then taskkill //F //T //IM ps-platform.exe > /dev/null 2>&1 || true; else kill %1 2>/dev/null || true; fi
          # Windows：Agent 安装程序静默安装（不注册自动运行）到临时目录，释放出的 Agent 必须与发布包中的程序完全一致
          if [ $ok = 1 ] && [ "$RUNNER_OS" = "Windows" ]; then
            setup=$(ls "$GITHUB_WORKSPACE"/dist/ps-platform-agent-setup-*.exe)
            inst=$(mktemp -d)
            # MSYS_NO_PATHCONV：防止 Git Bash 把 /S 这类参数改写成路径
            MSYS_NO_PATHCONV=1 "$setup" /S /noregister "/dir=$(cygpath -w "$inst/agent")" /url=127.0.0.1:18950 /token=ci-smoke /id=ci-smoke || ok=0
            if cmp -s "$inst/agent/ps-platform.exe" ps-platform.exe && [ -f "$inst/agent/ps-agent.exe" ] && grep -q '"id":"ci-smoke"' "$inst/agent/data/agent.json"; then
              echo "installer smoke passed"
            else
              ok=0
              cat "$TEMP/ps-platform-agent-setup.log" 2>/dev/null || true
              echo "::error title=smoke::Agent 安装程序静默安装失败或释放的 Agent 与发布包不一致"
            fi
          fi
          if [ $ok != 1 ]; then
            cat run.log
            tail -n 20 run.log | sed 's/%/%25/g' | while IFS= read -r l; do [ -n "$l" ] && echo "::error title=smoke::$l"; done
            echo "::error title=smoke::冒烟测试失败（健康接口 / 管理端 / 播放页未全部返回 200）"
            exit 1
          fi
          echo "smoke test passed"
      - uses: actions/upload-artifact@v4
        with:
          name: package-${{ matrix.os }}
          path: ${{ matrix.pattern }}
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true
      - name: 生成校验和与发布说明
        run: |
          cd assets && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt && cd ..
          ver="${TAG#v}"
          # 取 CHANGELOG.md 中对应版本的一节作为发布说明
          awk -v v="## $ver" '$0==v{f=1;next} /^## /{if(f)exit} f' CHANGELOG.md > notes.md || true
          {
            echo "## 下载"
            echo ""
            echo "| 系统 | 文件 | 可执行程序 |"
            echo "|---|---|---|"
            echo "| Windows x64 | \`ps-platform-$ver-windows-x64.zip\` | \`ps-platform.exe\` |"
            echo "| Linux x64（glibc ≥ 2.28） | \`ps-platform-$ver-linux-x64.tar.gz\` | \`ps-platform\` |"
            echo "| 渲染机 · Windows 10/11 图形安装程序 | \`ps-platform-agent-setup-$ver.exe\` | 双击按「下一步」安装 Agent |"
            echo "| 渲染机 · Linux Agent | \`ps-platform-agent-$ver-linux-x64\` | \`./ps-platform-agent-… --agent …\` |"
            echo ""
            echo "解压后按包内QUICKSTART.txt（快速上手）或 docs/INSTALL.md 运行，无需安装 Node.js；docker-compose 部署见 deploy/。"
            echo "渲染机一般不必单独下载：在管理端「机器 / GPU → 接入渲染机」复制安装链接，在渲染机浏览器中打开即可（Docker 部署的平台首次需点「从发布页获取」）。"
            echo ""
            cat notes.md
          } > release-notes.md
      - name: 创建 / 更新 Release 并上传文件
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --notes-file release-notes.md
            gh release upload "$TAG" assets/* --clobber
          else
            gh release create "$TAG" assets/* --title "ps-platform ${TAG#v}" --notes-file release-notes.md --verify-tag
          fi
