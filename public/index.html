<!DOCTYPE html>
<html lang="zh-CN">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>云渲染门户</title>
		<link rel="icon" href="/favicon.svg" />
		<style>
			:root { color-scheme: dark; }
			body { margin: 0; min-height: 100vh; background: linear-gradient(160deg, #0b1220, #05070a); color: #e8eaed; font: 15px/1.6 system-ui, "Microsoft YaHei", sans-serif; }
			main { max-width: 1080px; margin: 0 auto; padding: 48px 24px; }
			h1 { font-size: 26px; font-weight: 600; margin: 0 0 6px; }
			p.lead { opacity: .6; margin: 0 0 32px; }
			.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 16px; }
			a.card { display: block; padding: 20px; border-radius: 12px; background: rgba(255,255,255,.04); border: 1px solid rgba(255,255,255,.08); color: inherit; text-decoration: none; transition: border-color .2s, transform .2s; }
			a.card:hover { border-color: #4f8cff; transform: translateY(-2px); }
			a.card h2 { font-size: 17px; margin: 0 0 6px; }
			a.card p { margin: 0; opacity: .6; font-size: 13px; min-height: 2.6em; }
			.tag { display: inline-block; margin-top: 12px; font-size: 12px; padding: 2px 8px; border-radius: 99px; background: rgba(79,140,255,.15); color: #8fb4ff; }
			.empty { opacity: .5; }
		</style>
	</head>
	<body>
		<main>
			<h1>云渲染</h1>
			<p class="lead">选择要进入的场景</p>
			<div class="grid" id="list"><div class="empty">加载中…</div></div>
		</main>
		<script>
			fetch("/api/v1/public/programs")
				.then((r) => r.json())
				.then((list) => {
					const el = document.getElementById("list");
					el.textContent = "";
					const open = list.filter((p) => !p.requireToken);
					if (!open.length) return (el.innerHTML = '<div class="empty">暂无可直接访问的场景，请使用管理员提供的访问链接。</div>');
					if (open.length === 1 && !new URLSearchParams(location.search).has("portal")) return location.replace(`/play/${encodeURIComponent(open[0].id)}`);
					for (const p of open) {
						const a = document.createElement("a");
						a.className = "card";
						a.href = `/play/${encodeURIComponent(p.id)}`;
						const h = document.createElement("h2");
						h.textContent = p.name;
						const d = document.createElement("p");
						d.textContent = p.description || "";
						const t = document.createElement("span");
						t.className = "tag";
						t.textContent = "进入";
						a.append(h, d, t);
						el.append(a);
					}
				})
				.catch(() => (document.getElementById("list").textContent = "加载失败"));
		</script>
	</body>
</html>
