# =============================================================================
#  ps-platform 网关：nginx（唯一对外端口）+ ps-platform（信令 + 调度 + 管理端 + 内置 TURN/TCP 中继）
#
#  部署机：与 UE 渲染机同一内网的 Linux 主机（Docker Engine + compose v2）。
#    cp .env.example .env        # 一般只需填写密钥；网段、TURN 等参数可在管理端「系统设置 → 系统参数」维护
#    mkdir -p certs && 放入 fullchain.pem / privkey.pem（自签名也可，见 docs/INSTALL.md）
#    docker compose up -d --build
#    docker compose ps
#  管理端：http://<LAN_IP>:88/admin/（仅内网）   观众：https://<域名或IP:映射端口>/
#  渲染机：运行 ps-platform Agent 连接 ws://<LAN_IP>:88/agent（命令在管理端「机器 / GPU → 接入渲染机」中复制）
#
#  使用 host 网络：内置 TURN 的中继 UDP 端口必须以本机内网地址（LAN_IP）直接收发 UE 的数据。
#  （Docker Desktop 的 host 网络能力有限，Windows/macOS 请直接运行 ps-platform.exe）
# =============================================================================
name: ps-platform

services:
  platform:
    build:
      context: ..
      dockerfile: deploy/docker/Dockerfile
      target: platform
      args:
        NODE_IMAGE: ${NODE_IMAGE:-node:22-alpine}
        NPM_REGISTRY: ${NPM_REGISTRY:-}
    # 使用预构建镜像（华为云 SWR）时在 .env 设置 PS_IMAGE，然后 docker compose pull platform && docker compose up -d --no-build
    image: ${PS_IMAGE:-ps-platform:1.5.0}
    network_mode: host
    restart: unless-stopped
    init: true                           # tini 作为 1 号进程：转发信号、回收孤儿子进程
    volumes:
      - ${DATA_DIR:-./data}:/data
    environment:
      # ---- 启动参数（必须保留：监听端口、与 nginx 配套的 TURN 监听 / 内部入口）----
      PS_PORT: ${PS_PORT:-88}
      PS_HOST: 0.0.0.0
      PS_PUBLIC_PORT: ${PS_PUBLIC_PORT:-8088}
      PS_PUBLIC_HOST: 127.0.0.1
      PS_LOCAL_AGENT: "false"            # 容器里没有 UE；渲染机各自运行 Agent
      TURN_BUILTIN: "true"
      TURN_LISTEN: 127.0.0.1:${TURN_PORT:-3478}            # 须与下方 nginx 的 PS_TURN_UPSTREAM 一致
      TURN_HTTP_FALLBACK: ${INT_HTTP:-127.0.0.1:3480}       # 同端口明文 http，须与 nginx 的 PS_INT_HTTP 一致
      # ---- 密钥（留空 = 首次启动随机生成并保存在数据库）----
      PS_ADMIN_PASSWORD: ${PS_ADMIN_PASSWORD:-}   # 初始管理员口令，留空则随机生成，见 data/initial-admin.txt
      PS_AGENT_TOKEN: ${PS_AGENT_TOKEN:-}         # 管理端可查看 / 轮换
      PS_JWT_SECRET: ${PS_JWT_SECRET:-}
      TURN_SECRET: ${TURN_SECRET:-}
      # ---- 以下各项在管理端「系统设置 → 系统参数」维护；只有在 .env 中填写时才传入（并锁定为该值），留空 = 由管理端维护 ----
      PS_ADMIN_ALLOW: ${ADMIN_SUBNETS:-}
      PS_ENGINE_ALLOW: ${UE_SUBNETS:-}
      PS_LAN_NETWORKS: ${LAN_NETWORKS:-}
      PS_TRUST_PROXY: ${UPSTREAM_PROXIES:-}       # 本机 nginx（回环地址）始终可信，这里只填前面的上游反向代理
      PS_UE_HOST: ${PS_UE_HOST:-}
      PS_LOG_LEVEL: ${PS_LOG_LEVEL:-}
      TURN_RELAY_IP: ${LAN_IP:-}                  # 留空 = auto（第一个内网 IP）；多网卡时在 .env 或管理端填写
      TURN_ALLOWED_PEERS: ${UE_SUBNETS:-}
      TURN_MIN_PORT: ${TURN_MIN_PORT:-}
      TURN_MAX_PORT: ${TURN_MAX_PORT:-}
      TURN_WORKERS: ${TURN_WORKERS:-}
      # ---- 只在首次启动时作为初始值（之后以管理端「播放链路」为准）----
      TURN_FORCE_RELAY: ${TURN_FORCE_RELAY:-}
      DC_TURN_URLS: ${DC_TURN_URLS:-}
      DC_TURN_SECRET: ${DC_TURN_SECRET:-}
      UE_TURN_URLS: ${UE_TURN_URLS:-}
    ulimits:
      nofile: { soft: 65535, hard: 65535 }
    logging:
      driver: json-file
      options: { max-size: "20m", max-file: "5" }

  nginx:
    image: ${NGINX_IMAGE:-nginx:stable-alpine}
    network_mode: host
    restart: unless-stopped
    # 证书可选：没有 certs/fullchain.pem、privkey.pem 时以仅 http 模式启动（http:// 正常访问），放入证书后 restart nginx 启用 https
    entrypoint: ["/bin/sh", "/etc/nginx/ps/entrypoint.sh"]
    command: ["nginx", "-g", "daemon off;"]
    depends_on:
      platform:
        condition: service_healthy
    environment:
      NGINX_ENVSUBST_OUTPUT_DIR: /etc/nginx
      NGINX_ENVSUBST_FILTER: "^PS_"
      PS_MUX_PORT: ${MUX_PORT:-443}
      PS_HTTP_PORT: ${HTTP_PORT:-80}
      PS_PUBLIC_UPSTREAM: 127.0.0.1:${PS_PUBLIC_PORT:-8088}
      PS_TURN_UPSTREAM: 127.0.0.1:${TURN_PORT:-3478}
      PS_INT_HTTPS: ${INT_HTTPS:-127.0.0.1:8443}
      PS_INT_TURNS: ${INT_TURNS:-127.0.0.1:5349}
      PS_INT_TURN: ${INT_TURN:-127.0.0.1:3479}
      PS_INT_HTTP: ${INT_HTTP:-127.0.0.1:3480}
      PS_STATUS: ${STATUS_ADDR:-127.0.0.1:9180}
    volumes:
      - ./nginx/nginx.conf.template:/etc/nginx/ps/nginx.conf.template:ro
      - ./nginx/entrypoint.sh:/etc/nginx/ps/entrypoint.sh:ro
      - ${CERT_DIR:-./certs}:/etc/nginx/certs:ro
      - ./acme:/var/www/acme:ro
    ulimits:
      nofile: { soft: 65535, hard: 65535 }
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://${STATUS_ADDR:-127.0.0.1:9180}/healthz >/dev/null || exit 1"]
      interval: 15s
      timeout: 3s
      retries: 3
    logging:
      driver: json-file
      options: { max-size: "20m", max-file: "5" }
