# =============================================================================
#  ps-platform —— nginx 单端口对外（客户现场只需开放 nginx 这一个 TCP 端口，公网零 UDP 映射）
#
#  浏览器 ─TCP 443（或映射后的任意外网端口）─▶ nginx stream 多路复用
#      ├─ TLS 带 ALPN（浏览器 HTTPS）   ─▶ 127.0.0.1:8443 https/wss ─▶ ps-platform 观众口 127.0.0.1:8088
#      ├─ TLS 无 ALPN / SNI=turn.*     ─▶ 127.0.0.1:5349 nginx 终止 TLS ─▶ 内置 TURN 127.0.0.1:3478   turns:{host}:{port}
#      └─ 非 TLS（明文 TURN / 明文 HTTP）─▶ 127.0.0.1:3479 ─────────────────▶ 内置 TURN 127.0.0.1:3478   turn:{host}:{port}
#                                         └ TURN 识别出明文 HTTP（http://IP:端口/…）时转给 127.0.0.1:3480 的 http server
#  内置 TURN ──UDP，仅内网──▶ UE 渲染机。
#
#  管理端 / UE / Agent 走 ps-platform 管理口 :88（仅内网，不经过本文件）。
#  需要从外网管理时，见文件末尾可选的"管理端独立端口"。
#
#  本文件不含任何域名/公网地址：平台按浏览器实际访问的 host:端口 生成 TURN 地址，
#  内网 IP、映射后的外网 IP:端口、域名访问都无需改配置。只需放好证书：
#      /etc/nginx/certs/fullchain.pem   /etc/nginx/certs/privkey.pem
#  （IP 访问 / 自签名证书时浏览器只会使用明文 turn:，同样可用；turns: 需要受信任证书）
#
#  需要的模块：stream、stream_ssl、stream_ssl_preread、stream_realip、http_ssl、http_v2、http_realip
#  （nginx.org 官方 Linux 包 / 官方 Docker 镜像 / 官方 Windows zip 均已内置）
#  Windows 版 nginx：去掉 reuseport、so_keepalive 改为 on、日志路径改为 logs/...
# =============================================================================

worker_processes auto;
worker_rlimit_nofile 65535;

events {
    worker_connections 16384;        # 每个观众约 2 条长连接（信令 WebSocket + TURN）
}

stream {
    log_format ps_stream '$remote_addr [$time_local] $protocol $status '
                         'up=$bytes_received down=$bytes_sent ${session_time}s '
                         'alpn="$ssl_preread_alpn_protocols" sni="$ssl_preread_server_name" -> $upstream_addr';
    access_log /var/log/nginx/stream.log ps_stream buffer=64k flush=5s;

    # 内置 TURN（config.json turn.builtin.listen）。使用外部 coturn 时改成它的 TCP 监听，并把下面两处 proxy_protocol 改为 off
    upstream ps_turn {
        server 127.0.0.1:3478;
    }

    # ---- 单端口多路复用：路由键 "<TLS 版本>|<ALPN>|<SNI>" ------------------------
    #   1) 非 TLS（键以 | 开头）  → 明文 TURN over TCP
    #   2) SNI 以 turn. 开头      → TURN over TLS（可选的独立 TURN 域名）
    #   3) TLS 但没有 ALPN        → TURN over TLS（浏览器 HTTPS 必带 ALPN，浏览器内置 TURN 客户端不带）
    #   4) 其它 TLS               → https / wss
    map "$ssl_preread_protocol|$ssl_preread_alpn_protocols|$ssl_preread_server_name" $ps_route {
        "~^\|"           127.0.0.1:3479;
        "~\|turn\."      127.0.0.1:5349;
        "~^[^|]+\|\|"    127.0.0.1:5349;
        default          127.0.0.1:8443;
    }

    server {
        listen 443 reuseport so_keepalive=60s:10s:3;
        listen [::]:443 reuseport so_keepalive=60s:10s:3;
        ssl_preread on;
        preread_timeout 10s;
        proxy_pass $ps_route;
        proxy_protocol on;                 # 把真实客户端 IP 传给下一跳
        proxy_connect_timeout 5s;
        proxy_timeout 10m;                 # TURN 客户端每 ~5 分钟刷新分配；信令每 30s 心跳
        proxy_buffer_size 64k;
    }

    # ---- TURN over TLS --------------------------------------------------------
    server {
        listen 127.0.0.1:5349 ssl proxy_protocol;
        set_real_ip_from 127.0.0.1;
        ssl_certificate     /etc/nginx/certs/fullchain.pem;
        ssl_certificate_key /etc/nginx/certs/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_session_cache shared:ps_turn_tls:20m;
        ssl_session_timeout 4h;
        tcp_nodelay on;
        proxy_pass ps_turn;
        proxy_protocol on;                 # 内置 TURN 可识别 PROXY 协议（记录真实 IP）；coturn 改为 off
        proxy_timeout 10m;
        proxy_buffer_size 64k;
    }

    # ---- 明文 TURN over TCP ---------------------------------------------------
    server {
        listen 127.0.0.1:3479 proxy_protocol;
        set_real_ip_from 127.0.0.1;
        tcp_nodelay on;
        proxy_pass ps_turn;
        proxy_protocol on;                 # coturn 改为 off
        proxy_timeout 10m;
        proxy_buffer_size 64k;
    }
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    server_tokens off;
    access_log    /var/log/nginx/access.log combined buffer=64k flush=5s;

    # 同端口明文 http 一路：若请求来自前置反代（它已终止 https 并带了 X-Forwarded-Proto），沿用其值，平台才会下发 turns: 地址
    map $http_x_forwarded_proto $ps_fwd_proto {
        default $http_x_forwarded_proto;
        ""      http;
    }
    map $http_upgrade $ps_connection {
        default upgrade;
        ""      "";
    }
    # 公网只允许 peer-stream 子协议（浏览器观众）。UE / Agent 只能在内网直连平台管理口 :88
    map "$http_upgrade|$http_sec_websocket_protocol" $ps_ws_forbidden {
        default                          0;
        "~*^websocket\|(?!peer-stream$)" 1;
    }
    # 每个来源 IP 的并发连接上限（防刷）。企业 NAT 场景几百人可能共用一个出口 IP，不要设太小
    limit_conn_zone $binary_remote_addr zone=ps_conn:10m;

    upstream ps_public {
        server 127.0.0.1:8088 max_fails=0;  # config.json → http.publicPort（观众专用口）
        keepalive 32;
        keepalive_timeout 60s;              # 须小于平台的 keepAliveTimeout（65s）
    }

    # 80：证书签发 + 跳转 https（对外端口本身同时支持 http:// 与 https://，见下方"同端口明文 http"）
    server {
        listen 80 default_server;
        listen [::]:80 default_server;
        server_name _;
        location /.well-known/acme-challenge/ { root /var/www/acme; }
        location / { return 301 https://$host$request_uri; }
    }

    # 本机状态口：健康检查 / 监控用。443 会把"不带 ALPN 的 TLS"当作 TURNS，
    # 很多探活工具（busybox wget、部分负载均衡）不发 ALPN，所以探活打这里，不要打 443。
    server {
        listen 127.0.0.1:9180;
        access_log off;
        location = /healthz      { proxy_pass http://ps_public/healthz; }
        location = /nginx_status { stub_status; }
        location /               { return 404; }
    }

    server {
        listen 127.0.0.1:8443 ssl proxy_protocol default_server;
        http2 on;
        server_name _;

        set_real_ip_from 127.0.0.1;
        real_ip_header   proxy_protocol;

        ssl_certificate     /etc/nginx/certs/fullchain.pem;
        ssl_certificate_key /etc/nginx/certs/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_session_cache shared:ps_https:20m;

        # HSTS：只在使用受信任证书、且不再需要 http:// 访问时开启（自签名证书 + HSTS 会让浏览器无法"继续访问"，也会把 http 链接强制升级）
        # add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options    nosniff always;
        add_header Referrer-Policy           same-origin always;
        client_max_body_size 16m;            # 工具接口（寻路）开放给观众口时请求体较大

        # 纵深防御：管理端与敏感文件不对公网开放（平台观众口本身也会拒绝）
        location ~ ^/(admin|metrics)(/|$)            { return 404; }
        location ~* \.(pem|key|sqlite3?|log|env)$    { return 403; }

        location / {
            if ($ps_ws_forbidden) { return 403; }
            limit_conn ps_conn 500;

            proxy_pass http://ps_public;
            proxy_http_version 1.1;
            proxy_set_header Host              $http_host;   # 保留浏览器实际使用的 host:端口（含映射端口），用于生成 TURN 地址
            proxy_set_header X-Forwarded-Host  $http_host;
            proxy_set_header Upgrade           $http_upgrade;
            proxy_set_header Connection        $ps_connection;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for; # 追加：平台只信任 security.trustProxy 中的代理，取最右侧不可信地址，客户端无法伪造
            proxy_set_header X-Forwarded-Proto https;
            proxy_read_timeout  1h;
            proxy_send_timeout  1h;
            proxy_buffering     off;
        }
    }

    # ---- 同端口明文 http（http://IP:端口/video.html?urlPrefix=xx、嵌入 http 业务系统）--------------
    # 对外端口上的非 TLS 流量先交给内置 TURN；TURN 识别出是 HTTP 请求（不是 STUN）后，带 PROXY 头转到这里。
    # 需要平台配置 turn.builtin.httpFallback = "127.0.0.1:3480"（docker-compose 已默认开启）。
    server {
        listen 127.0.0.1:3480 proxy_protocol;
        server_name _;
        set_real_ip_from 127.0.0.1;
        real_ip_header   proxy_protocol;
        add_header X-Content-Type-Options nosniff always;
        client_max_body_size 16m;

        location ~ ^/(admin|metrics)(/|$)            { return 404; }
        location ~* \.(pem|key|sqlite3?|log|env)$    { return 403; }

        location / {
            if ($ps_ws_forbidden) { return 403; }
            limit_conn ps_conn 500;

            proxy_pass http://ps_public;
            proxy_http_version 1.1;
            proxy_set_header Host              $http_host;
            proxy_set_header X-Forwarded-Host  $http_host;
            proxy_set_header Upgrade           $http_upgrade;
            proxy_set_header Connection        $ps_connection;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $ps_fwd_proto;   # 前置反代终止了 https 时沿用它的值，否则为 http
            proxy_read_timeout  1h;
            proxy_send_timeout  1h;
            proxy_buffering     off;
        }
    }

    # ---- 可选：管理端独立端口（只允许指定网段）----------------------------------
    # 现场只开放了 nginx、又需要远程管理时启用。平台把 127.0.0.1 视为可信代理，
    # 会按 X-Forwarded-For 中的真实 IP 再校验一次 config.json 的 security.adminAllow。
    # server {
    #     listen 8444 ssl;
    #     http2 on;
    #     ssl_certificate     /etc/nginx/certs/fullchain.pem;
    #     ssl_certificate_key /etc/nginx/certs/privkey.pem;
    #     allow 203.0.113.0/24;           # 运维出口 IP
    #     deny  all;
    #     client_max_body_size 16m;
    #     location / {
    #         proxy_pass http://127.0.0.1:88;
    #         proxy_http_version 1.1;
    #         proxy_set_header Host            $http_host;
    #         proxy_set_header Upgrade         $http_upgrade;
    #         proxy_set_header Connection      $ps_connection;
    #         proxy_set_header X-Forwarded-For $remote_addr;
    #         proxy_set_header X-Forwarded-Proto https;
    #         proxy_read_timeout 1h;
    #     }
    # }
}
