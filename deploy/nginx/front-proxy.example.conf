# =============================================================================
#  前置 nginx / OpenResty（边缘反向代理）接入 ps-platform 网关
#  —— 同一个对外端口（下文 8443）承载网页、wss 信令和视频（TURN over TLS），证书仍由前置代理持有
#
#  适用：外网 https://ue.example.com:8443 先到一台已有的 nginx/OpenResty（持有正式证书、可能还代理其它站点），
#        再转到 ps-platform 网关（下文 192.168.10.31:9443，即网关 nginx 的多路复用端口）。
#
#  为什么必须用 stream：视频走 TURN（TCP/TLS 上的二进制协议）。只用 http { server { proxy_pass } } 做 HTTP 反代时，
#  TURN 会被回 400，表现为"页面能开、信令正常、一直没有画面"。stream + ssl_preread 在四层按流量类型分流：
#
#   外网 :8443 ─▶ stream 分流（本文件，向内部端口发送 PROXY 头以保留真实 IP）
#     ├─ TLS + ALPN 且 SNI=ue.example.com  ─▶ 127.0.0.1:18444 https（正式证书）─▶ http://网关:9443   网页 + wss 信令
#     ├─ TLS 无 ALPN 且 SNI=ue.example.com ─▶ 127.0.0.1:15349 终止 TLS（正式证书）─▶ 网关:9443（明文 TURN）  浏览器 turns:
#     ├─ 非 TLS（明文）                    ─▶ 127.0.0.1:18080 跳转到 https（不透传给网关，杜绝伪造 X-Forwarded-For）
#     └─ 其它 TLS（其它域名）              ─▶ 127.0.0.1:18443 本机原有站点
#
#  浏览器的 TURN 客户端连接 turns: 时携带 SNI、不带 ALPN，因此能与网页共用同一域名和端口。
#  平台默认下发 turn:{host}:{port} 与 turns:{host}:{port}：经前置代理访问时 turns:ue.example.com:8443 生效，
#  明文 turn: 会被前置代理拒绝（很快失败，不影响连接）。不需要再开额外端口，也不需要改 ps-platform 的 TURN 配置。
#
#  使用步骤：
#   1) 确认模块：nginx -V 2>&1 | grep -o with-stream_ssl_preread_module （OpenResty、nginx 官方包、宝塔/1Panel 的 OpenResty 均自带）
#   2) 把下面的 stream { } 块加到 nginx.conf 顶层（与 http { } 并列，不能放进 http 里）。
#   3) 原来监听 8443 的站点改为监听 127.0.0.1:18443（见文末 http 部分），由 stream 的 default 分支转进来。
#   4) 替换：ue.example.com → 你的域名；192.168.10.31:9443 → 网关 nginx 的对外端口；证书路径。
#   5) 网关侧：deploy/.env 中 UPSTREAM_PROXIES=<本前置代理的内网 IP>，重启 platform（否则观众 IP 都显示为前置代理的地址）。
#   6) nginx -t && nginx -s reload。验证见 docs/INSTALL.md 8.1。
# =============================================================================

stream {
    upstream ps_gateway {
        server 192.168.10.31:9443;            # 网关 nginx 多路复用端口（网关会再区分 TURN / http）
    }

    # 路由键 "<TLS 版本>|<ALPN>|<SNI>"，按顺序匹配
    map "$ssl_preread_protocol|$ssl_preread_alpn_protocols|$ssl_preread_server_name" $front_route {
        "~^\|"                                  127.0.0.1:18080;     # 非 TLS → 本机跳转 https
        "~^[^|]+\|\|ue\.example\.com$"          127.0.0.1:15349;     # TLS 无 ALPN + 本域名 → TURNS
        "~^[^|]+\|[^|]+\|ue\.example\.com$"     127.0.0.1:18444;     # TLS 带 ALPN + 本域名 → https/wss
        default                                 127.0.0.1:18443;     # 其它域名 → 原有站点
    }

    server {
        listen 8443 reuseport so_keepalive=60s:10s:3;   # Windows 版去掉 reuseport，so_keepalive 改为 on
        ssl_preread on;
        preread_timeout 10s;
        proxy_pass $front_route;
        proxy_protocol on;                  # 内部端口都按 proxy_protocol 接收，保留真实客户端 IP
        proxy_connect_timeout 5s;
        proxy_timeout 10m;                  # TURN 每 ~5 分钟刷新、信令每 30 秒心跳
        proxy_buffer_size 64k;
    }

    # TURNS：用正式证书终止 TLS，把明文 TURN 交给网关（不带 PROXY 头，网关端口不接受）
    server {
        listen 127.0.0.1:15349 ssl proxy_protocol;
        ssl_certificate     /etc/nginx/certs/ue.example.com/fullchain.pem;
        ssl_certificate_key /etc/nginx/certs/ue.example.com/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_session_cache shared:front_turns:10m;
        ssl_session_timeout 4h;
        tcp_nodelay on;
        proxy_pass ps_gateway;
        proxy_timeout 10m;
        proxy_buffer_size 64k;
    }
}

http {
    # ……保留原有 http 配置……

    map $http_upgrade $front_connection {
        default upgrade;
        ""      "";
    }

    # ue.example.com 的网页 + 信令（TLS 在这里终止）
    server {
        listen 127.0.0.1:18444 ssl proxy_protocol;
        http2 on;
        server_name ue.example.com;
        set_real_ip_from 127.0.0.1;
        real_ip_header   proxy_protocol;    # $remote_addr = 真实客户端
        ssl_certificate     /etc/nginx/certs/ue.example.com/fullchain.pem;
        ssl_certificate_key /etc/nginx/certs/ue.example.com/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        client_max_body_size 16m;

        location / {
            proxy_pass http://192.168.10.31:9443;           # 用 http://（网关同端口识别明文 http）。不要用 https://：nginx 回源不带 ALPN，会被网关当作 TURNS
            proxy_http_version 1.1;
            proxy_set_header Host              $http_host;  # 必须保留浏览器访问的 host:端口（平台据此生成 TURN 地址）
            proxy_set_header Upgrade           $http_upgrade;
            proxy_set_header Connection        $front_connection;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;       # 平台据此下发 turns: 地址
            proxy_read_timeout  1h;
            proxy_send_timeout  1h;
            proxy_buffering     off;
        }
    }

    # 明文访问 :8443 → 跳转 https（保持原有行为）
    server {
        listen 127.0.0.1:18080 proxy_protocol;
        set_real_ip_from 127.0.0.1;
        real_ip_header   proxy_protocol;
        return 301 https://$host:8443$request_uri;
    }

    # 原来监听 8443 的其它站点：改成内部端口（其余配置不变）
    # server {
    #     listen 127.0.0.1:18443 ssl proxy_protocol;    # 原为 listen 8443 ssl;
    #     set_real_ip_from 127.0.0.1;
    #     real_ip_header   proxy_protocol;
    #     server_name other.example.com;
    #     ...
    # }
}
