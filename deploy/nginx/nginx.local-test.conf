# 本机验证用配置（Windows / Linux 通用，无需 root、无需真实域名）。
# 与 nginx.conf 的多路复用逻辑完全一致，只是端口改为高位端口，并额外提供一个明文 http 入口方便免证书测试。
#
#   19443  对外入口（TLS ALPN 分流 + 明文 TURN）← 对应生产的 443
#   19080  明文 http/ws 入口（仅测试用）
#   ps-platform：管理口 19088（UE/Agent/管理端），观众口 19089（仅 nginx 访问），内置 TURN 127.0.0.1:19478
#
# 启动： nginx -p <nginx目录> -c <本文件绝对路径>
# 证书： certs/test.crt / certs/test.key（相对 nginx -p 目录下的 conf/，自签名即可，见 INSTALL.md）

worker_processes 1;
error_log logs/error.log info;
events { worker_connections 1000; }

stream {
    log_format ps_stream '$remote_addr [$time_local] $protocol $status up=$bytes_received down=$bytes_sent '
                         '${session_time}s alpn="$ssl_preread_alpn_protocols" sni="$ssl_preread_server_name" -> $upstream_addr';
    access_log logs/stream.log ps_stream;

    upstream ps_turn { server 127.0.0.1:19478; }

    map "$ssl_preread_protocol|$ssl_preread_alpn_protocols|$ssl_preread_server_name" $ps_route {
        "~^\|"           127.0.0.1:19446;
        "~\|turn\."      127.0.0.1:19445;
        "~^[^|]+\|\|"    127.0.0.1:19445;
        default          127.0.0.1:19444;
    }

    server {
        listen 19443;
        ssl_preread on;
        preread_timeout 10s;
        proxy_pass $ps_route;
        proxy_protocol on;
        proxy_connect_timeout 5s;
        proxy_timeout 10m;
    }

    server {
        listen 127.0.0.1:19445 ssl proxy_protocol;
        set_real_ip_from 127.0.0.1;
        ssl_certificate     certs/test.crt;
        ssl_certificate_key certs/test.key;
        tcp_nodelay on;
        proxy_pass ps_turn;
        proxy_protocol on;
        proxy_timeout 10m;
    }

    server {
        listen 127.0.0.1:19446 proxy_protocol;
        set_real_ip_from 127.0.0.1;
        tcp_nodelay on;
        proxy_pass ps_turn;
        proxy_protocol on;
        proxy_timeout 10m;
    }
}

http {
    default_type application/octet-stream;
    access_log logs/access.log;

    # 同端口明文 http 一路：若请求来自前置反代（它已终止 https 并带了 X-Forwarded-Proto），沿用其值，平台才会下发 turns: 地址
    map $http_x_forwarded_proto $ps_fwd_proto {
        default $http_x_forwarded_proto;
        ""      http;
    }
    map $http_upgrade $ps_connection {
        default upgrade;
        ""      "";
    }
    map "$http_upgrade|$http_sec_websocket_protocol" $ps_ws_forbidden {
        default                          0;
        "~*^websocket\|(?!peer-stream$)" 1;
    }

    upstream ps_public {
        server 127.0.0.1:19089 max_fails=0;
        keepalive 16;
        keepalive_timeout 60s;
    }

    server {
        listen 127.0.0.1:19444 ssl proxy_protocol;
        set_real_ip_from 127.0.0.1;
        real_ip_header   proxy_protocol;
        ssl_certificate     certs/test.crt;
        ssl_certificate_key certs/test.key;
        client_max_body_size 16m;

        location ~ ^/(admin|metrics)(/|$)         { return 404; }
        location ~* \.(pem|key|sqlite3?|log|env)$ { return 403; }

        location / {
            if ($ps_ws_forbidden) { return 403; }
            proxy_pass http://ps_public;
            proxy_http_version 1.1;
            proxy_set_header Host              $http_host;
            proxy_set_header X-Forwarded-Host  $http_host;
            proxy_set_header Upgrade           $http_upgrade;
            proxy_set_header Connection        $ps_connection;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_read_timeout  1h;
            proxy_send_timeout  1h;
            proxy_buffering     off;
        }
    }

    # ---- 同端口明文 http（http://IP:端口/video.html?urlPrefix=xx、嵌入 http 业务系统）--------------
    # 对外端口上的非 TLS 流量先交给内置 TURN；TURN 识别出是 HTTP 请求（不是 STUN）后，带 PROXY 头转到这里。
    # 需要平台配置 turn.builtin.httpFallback = "127.0.0.1:19447"（docker-compose 已默认开启）。
    server {
        listen 127.0.0.1:19447 proxy_protocol;
        server_name _;
        set_real_ip_from 127.0.0.1;
        real_ip_header   proxy_protocol;
        add_header X-Content-Type-Options nosniff always;
        client_max_body_size 16m;

        location ~ ^/(admin|metrics)(/|$)            { return 404; }
        location ~* \.(pem|key|sqlite3?|log|env)$    { return 403; }

        location / {
            if ($ps_ws_forbidden) { return 403; }

            proxy_pass http://ps_public;
            proxy_http_version 1.1;
            proxy_set_header Host              $http_host;
            proxy_set_header X-Forwarded-Host  $http_host;
            proxy_set_header Upgrade           $http_upgrade;
            proxy_set_header Connection        $ps_connection;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $ps_fwd_proto;   # 前置反代终止了 https 时沿用它的值，否则为 http
            proxy_read_timeout  1h;
            proxy_send_timeout  1h;
            proxy_buffering     off;
        }
    }

    # 明文测试入口：浏览器访问 http://<本机IP>:19080/ 免证书；TURN 地址按 {host}:{port} 生成为 turn:<本机IP>:19080，
    # 本入口不做 TURN 分流，所以测试时 TURN 服务器请在管理端配置为 turn:<本机IP>:19443?transport=tcp
    server {
        listen 19080;
        client_max_body_size 16m;
        location ~ ^/(admin|metrics)(/|$) { return 404; }
        location / {
            if ($ps_ws_forbidden) { return 403; }
            proxy_pass http://ps_public;
            proxy_http_version 1.1;
            proxy_set_header Host              $http_host;
            proxy_set_header Upgrade           $http_upgrade;
            proxy_set_header Connection        $ps_connection;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $ps_fwd_proto;   # 前置反代终止了 https 时沿用它的值，否则为 http
            proxy_read_timeout  1h;
            proxy_buffering     off;
        }
    }
}
